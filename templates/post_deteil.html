{%extends "new.html" %}
{%block bi %}
Статья
{% endblock %}
{%block nu %}
<div class="container mt-5">
    <h1>{{article.title}}</h1>
    <p>{{article.date.strftime('%d.%m.%Y %H:%M')}}</p>
    <p>{{article.text}}</p>
    <a href=" /posts"> назад ко всем статям</a>
    <a href="/posts/{{article.id}}/del" class="btn btn-danger">Удалить</a>
    <a href="/posts/{{article.id}}/update" class="btn btn-primary">Редактировать</a>


</div>
{% endblock %}
